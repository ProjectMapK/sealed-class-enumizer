kotlin.code.style=official

# 配布版の自版。フル版は <KotlinVersion>-<自版> 形式で、前半の Kotlin 版は gradle/libs.versions.toml が正
# （ルートの build.gradle.kts が結合して全モジュールへ配る）
enumizerVersion=0.1.0-SNAPSHOT
# runtime-api はクロスコンパイル対象の native ターゲットを宣言するため、ホストで実行不能な
# テストタスクの警告を抑止する
kotlin.native.ignoreDisabledTargets=true

# 3 モジュールは互いに独立なので並行に構成・実行する
org.gradle.parallel=true
# タスク出力を再利用する（integration-test 側と前提を揃える）
org.gradle.caching=true
# 既定のデーモン設定（-Xmx512m / MaxMetaspaceSize=384m）は KGP と Kotlin コンパイラを載せるには
# 小さいため引き上げる
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=768m
