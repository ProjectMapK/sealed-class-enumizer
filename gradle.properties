kotlin.code.style=official

# 配布版の自版。フル版は <KotlinVersion>-<自版> 形式で、前半の Kotlin 版は gradle/libs.versions.toml が正
# （ルートの build.gradle.kts が結合して全モジュールへ配る）
enumizerVersion=0.1.1-SNAPSHOT

# コンパイラプラグイン ID の単一情報源。compiler-plugin の EnumizeCommandLineProcessor.PLUGIN_ID と
# 一致していなければならない。gradle-plugin / maven-plugin はビルド時生成の Coordinates 経由で参照し、
# Gradle の plugin id もこれに揃える（利用者が書く識別子を 1 つに保つ）
compilerPluginId=io.github.projectmapk.sealed-class-enumizer

# Maven Central 公開の POM 共通値（vanniktech maven publish の規約キー）。
# モジュール別の POM_NAME / POM_DESCRIPTION は各モジュールの gradle.properties が持つ
POM_URL=https://github.com/ProjectMapK/sealed-class-enumizer
POM_INCEPTION_YEAR=2026
POM_LICENSE_NAME=The Apache License, Version 2.0
POM_LICENSE_URL=https://www.apache.org/licenses/LICENSE-2.0.txt
POM_LICENSE_DIST=repo
POM_SCM_URL=https://github.com/ProjectMapK/sealed-class-enumizer
POM_SCM_CONNECTION=scm:git:git://github.com/ProjectMapK/sealed-class-enumizer.git
POM_SCM_DEV_CONNECTION=scm:git:ssh://git@github.com/ProjectMapK/sealed-class-enumizer.git
POM_DEVELOPER_ID=wrongwrong
POM_DEVELOPER_NAME=wrongwrong
# runtime-api はクロスコンパイル対象の native ターゲットを宣言するため、ホストで実行不能な
# テストタスクの警告を抑止する
kotlin.native.ignoreDisabledTargets=true

# 3 モジュールは互いに独立なので並行に構成・実行する
org.gradle.parallel=true
# タスク出力を再利用する（integration-test 側と前提を揃える）
org.gradle.caching=true
# 既定のデーモン設定（-Xmx512m / MaxMetaspaceSize=384m）は KGP と Kotlin コンパイラを載せるには
# 小さいため引き上げる
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=768m
