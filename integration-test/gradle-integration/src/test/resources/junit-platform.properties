# 並行実行の方針（docs/test/フィクスチャ構成.md §4）。粒度はテストメソッド単位とし、
# DiagTestBase 系だけが @Execution(SAME_THREAD) でクラス内直列に落ちる。
#
# 同時実行数（config.fixed.parallelism / config.fixed.max-pool-size）はホストの資源から算出するため、
# ここではなく gradle-integration/build.gradle.kts がシステムプロパティで渡す
# （システムプロパティは本ファイルより優先される）
junit.jupiter.execution.parallel.enabled=true
junit.jupiter.execution.parallel.mode.default=concurrent
junit.jupiter.execution.parallel.mode.classes.default=concurrent
junit.jupiter.execution.parallel.config.strategy=fixed
