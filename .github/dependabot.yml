# 依存の version updates（マニフェスト = version catalog / ビルドスクリプト / ワークフロー由来）。
# Kotlin の更新 PR は catalog 経由で配布版 <KotlinVersion>-<自版> の導出まで自動で追随し、CI が検証する。
# 解決済み依存グラフ（推移依存含む）に対する alerts は build.yml の dependency-submission ジョブが補完する
version: 2
updates:
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "friday"
      time: "19:00"
      timezone: "Asia/Tokyo"
  # integration-test は独立した Gradle ビルド（バージョン宣言は親カタログ共有のため、対象は settings 等の残余）
  - package-ecosystem: "gradle"
    directory: "/integration-test"
    schedule:
      interval: "weekly"
      day: "friday"
      time: "19:00"
      timezone: "Asia/Tokyo"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "friday"
      time: "19:00"
      timezone: "Asia/Tokyo"
