# 依存の version updates（マニフェスト = version catalog / ビルドスクリプト / ワークフロー由来）。
# Kotlin の更新 PR は catalog 経由で配布版 <KotlinVersion>-<自版> の導出まで自動で追随し、CI が検証する。
# catalog の maven 版・README / docs / .idea 中の現行バージョン表記はマニフェスト更新では変わらないため、
# CI（ルートの checkMavenVersion / checkVersionMentions）が乖離を検出したら、
# 同期タスク（syncMavenVersion / syncVersionMentions）の実行結果を更新 PR へコミットして追随させる。
# 解決済み依存グラフ（推移依存含む）に対する alerts は ci.yml の dependency-submission ジョブが補完する
#
# npm（kotlin-js-store/yarn.lock）は version updates の対象に含めない。lockfile は KGP が
# JS/wasm テストランナー用に生成する成果物であり、宣言元の package.json はリポジトリに存在しないため、
# Dependabot の更新 PR は次の kotlinUpgradeYarnLock で失われる。alerts は次の基準で捌く。
#   1. 上流の宣言レンジ内に修正版がある場合: lockfile を作り直して追随する（手順は CLAUDE.md）。
#      上流の解決へ合わせる通常の更新と同じ操作であり、alert 固有の手当ては要らない
#   2. レンジ内に修正版が無い場合: tolerable_risk として dismiss し、上流が追随するのを待つ。npm 依存は
#      runtime-api の配布物に入らず（生成 package.json は依存ゼロ、公開先は Maven Central のみ）、
#      処理する入力も CI 内の自リポジトリのテスト成果物に限られる。resolutions による major 跨ぎの
#      強制上書きは、上流が検証していない組み合わせをテストランナーへ注入するため、重大な脆弱性に
#      上流が追随しないときに限って検討する
version: 2
updates:
  # integration-test は独立した Gradle ビルドだが、その settings はルートビルドを composite 参照するため、
  # /integration-test の更新ジョブが見るマニフェストはルート側（gradle wrapper 等）を含む。
  # ディレクトリごとに更新ジョブを分けると同一の更新が別々の PR として二重に出るため、両者を1つの
  # 更新設定にまとめ、groups で PR の粒度を決める（PR の対象範囲と表題も一致する）
  - package-ecosystem: "gradle"
    directories:
      - "/"
      - "/integration-test"
    schedule:
      interval: "weekly"
      day: "friday"
      time: "19:00"
      timezone: "Asia/Tokyo"
    groups:
      # Kotlin のライブラリとプラグインは catalog の単一の版宣言（version.ref = "kotlin"）を共有する。
      # 依存名ごとに分けると同じ 1 行を書き換えるだけの PR が依存の数だけ並ぶため、パターンで束ねる。
      # 版宣言を持つのはルート側の catalog だけなので、束ねてもディレクトリを跨いだ二重の PR にはならない
      kotlin:
        patterns:
          - "org.jetbrains.kotlin:*"
          - "org.jetbrains.kotlin.*"
      # 残りは依存名ごとの単一 PR へ束ねる。group-by は部分グループを作る際に他のグループの
      # 割り当てを見ないため、kotlin グループが持つ対象は exclude-patterns で明示的に外す
      gradle-builds:
        group-by: "dependency-name"
        exclude-patterns:
          - "org.jetbrains.kotlin:*"
          - "org.jetbrains.kotlin.*"
    ignore:
      # Maven 系の版は kotlin-maven-plugin の親 POM から導出する値であり（ルートの syncMavenVersion）、
      # 独立して選べる更新対象ではない。Kotlin の更新に伴って追随する
      # （maven-core の他、ハーネスの apache-maven 配布物も catalog の maven 版を共有する）
      - dependency-name: "org.apache.maven:*"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "friday"
      time: "19:00"
      timezone: "Asia/Tokyo"
