# CI。基本は ubuntu（ルート build / integration-test のモジュールビルド /
# TestKit の分割実行 / Maven ビルド）で、OS 分岐は必要な範囲のみ: macos = Apple ターゲットのネイティブツールチェーン確認
# （ルート build と公開可能ターゲットの検査）・windows = mingwX64 の実行テストのみ（native の box 実行はホスト依存ゲートで
# Windows でしか走らない）。main への push では加えて依存グラフを登録する。
# アクションはコミットハッシュで固定する（末尾コメントの vX.Y.Z は参照用。更新は Dependabot が追随する）。
name: CI

# ビルド入力の allowlist で無駄な実行を避ける（除外方式は、他のワークフローの追加・編集など
# 無関係ファイルの変更で起動してしまうため採らない）。ビルド入力となるファイル種別・パスを増やした場合は
# push の paths と changes ジョブのフィルタの両方へ追加すること（両者は同義に保つ）。
# 本ファイル自身は列挙し、この CI 定義の変更では起動させる。
# .gitattributes は LF 正規化経由でフィクスチャの挙動に影響しうるため入力に含める
# （.editorconfig はビルドが読まないため列挙しない）。
# 列挙パス内でもビルドに影響しない種別（.md）は個別に除外する。ただし現行バージョン表記の検証は
# README / docs を入力に持つため、PR では changes ジョブの専用フィルタで version-mentions ジョブを起動する。
# .txt は TestKit フィクスチャの入力種別のため、除外の対象にしてはならない。
#
# PR では起動条件に paths を置かない。paths でスキップされたワークフローのチェックは pending のまま残り、
# 必須チェック（ci-gate）が報告されずマージがブロックされるため。
# 判定は changes ジョブへ降ろし、各ジョブの実行条件として扱う
on:
  push:
    branches: [main]
    paths:
      - "**/src/**"
      - "**.gradle.kts"
      - "**.properties"
      - "gradlew"
      - "gradlew.bat"
      - "gradle/**"
      - "kotlin-js-store/**"
      - "integration-test/kotlin-js-store/**"
      - ".gitattributes"
      - ".github/workflows/ci.yml"
      - "!**.md"
  pull_request:
  # GITHUB_TOKEN が作った PR は push / pull_request を起こさないため、release / _publish が出す
  # 版更新の PR には必須チェックが報告されない。それらがブランチを指定して起こすための入口
  # （workflow_dispatch は GITHUB_TOKEN でも起動できる）。手での起動口も兼ねる
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # PR でのビルド入力の変更有無を判定する（push は起動条件の paths で判定済みのため常に true とする）。
  # フィルタは push の paths と同義に保つ。評価器（picomatch）の記法差のみ吸収し、
  # `**.kts` 形式は階層をまたがないため `**/*.kts` 形式とした上でルート直下向けの `*.kts` も併記する。
  # 除外（`!`）は predicate-quantifier: some-with-excludes を指定した時のみ意図どおり働く
  # （既定の some では除外パターンが OR 評価となり「.md 以外の全ファイル」へ一致してしまう）
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # PR の変更ファイル一覧は REST API から取得するため pull-requests: read が要る
    permissions:
      contents: read
      pull-requests: read
    outputs:
      build: ${{ github.event_name != 'pull_request' || steps.filter.outputs.build }}
      # push はビルド入力の変更でしか起動せず、そちらは build ジョブの check が版表記検証を含むため、
      # このフィルタは PR のみ評価する（push では常に false = ジョブをスキップ）
      versionMentions: ${{ github.event_name == 'pull_request' && steps.filter.outputs.versionMentions }}
      # 配布物のソースを変更したか。エントリの要否は PR 単位でしか決まらないため PR のみ評価する
      changelog: ${{ github.event_name == 'pull_request' && steps.filter.outputs.changelog }}
    steps:
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        if: github.event_name == 'pull_request'
        with:
          predicate-quantifier: some-with-excludes
          filters: |
            build:
              - "**/src/**"
              - "*.gradle.kts"
              - "**/*.gradle.kts"
              - "*.properties"
              - "**/*.properties"
              - "gradlew"
              - "gradlew.bat"
              - "gradle/**"
              - "kotlin-js-store/**"
              - "integration-test/kotlin-js-store/**"
              - ".gitattributes"
              - ".github/workflows/ci.yml"
              - "!**/*.md"
            versionMentions:
              - "README.md"
              - "docs/**"
              - ".idea/kotlinc.xml"
            # 公開 4 モジュールの production ソース（利用者へ配られる変更の範囲）。テストソース・
            # integration-test（パスが 1 段深い）・ビルドスクリプトは配布物の内容を変えないため含めない。
            # 版更新（catalog）も対象外とする — 版そのものは版形式が表しており、Dependabot は
            # エントリを書けない
            changelog:
              - "*/src/main/**"
              - "*/src/commonMain/**"

  build:
    needs: changes
    if: needs.changes.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      # K/N ツールチェーンと platform libs（Apple 系 klib のクロスコンパイルを含む）
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
      - run: ./gradlew build

  # integration-test は 9 モジュールのビルドと、重いテスト（TestKit / Maven）を別ジョブへ分ける。
  # 同一ジョブだと互いにランナーのコアを奪い合い、開始が待たされる
  integration-modules:
    needs: changes
    if: needs.changes.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
      - run: >-
          ./gradlew -p integration-test build
          -x :gradle-integration:test -x :maven-integration:test

  # TestKit テストはランナーを増やして分割する。ランナーのコア数ではジョブ内の並行度を上げても
  # 実行時間が縮まらないため（同時実行 2 で 1 割・4 で頭打ち）、ジョブ内は直列にして分割数で稼ぐ。
  # 分割の振り分けはテストクラス名から決まるため、クラスを追加しても取りこぼさない
  integration-testkit:
    needs: changes
    if: needs.changes.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
      # TestKit はローカル Maven の非タイムスタンプ SNAPSHOT を入力に持ち UP-TO-DATE 判定が信用できないため
      # --rerun で必ず再実行する（docs/test/フィクスチャ構成.md §4）
      - run: >-
          ./gradlew -p integration-test :gradle-integration:test --rerun
          -PtestShardIndex=${{ matrix.shard }} -PtestShardCount=3 -PtestKitParallelism=1

  # Maven ビルドの検証（docs/test/ケース06-ビルド動態.md §7）。Maven 本体は Gradle 側の依存として
  # 取得するためインストール手順は要らない。フィクスチャは Kotlin 一式をテスト専用のローカルリポジトリ
  # （~/.m2/repository とは別。docs/test/フィクスチャ構成.md §6）へ取得するため、そこをキャッシュする
  integration-maven:
    needs: changes
    if: needs.changes.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: integration-test/maven-integration/build/maven-local-repo
          key: maven-repo-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
      # フィクスチャの入力にはローカル Maven の非タイムスタンプ SNAPSHOT が含まれ UP-TO-DATE 判定が
      # 信用できないため --rerun で必ず再実行する（TestKit と同じ理由）
      - run: ./gradlew -p integration-test :maven-integration:test --rerun

  build-macos:
    needs: changes
    if: needs.changes.outputs.build == 'true'
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
      - run: ./gradlew build
      # CD と同じランナーで、宣言ターゲットが全て公開できることを確かめる（賄えないターゲットの
      # publication は静かに落ちるため、公開時ではなく PR の時点で検出する）
      - run: ./gradlew :sealed-class-enumizer-runtime-api:checkPublishableTargets

  native-windows:
    needs: changes
    if: needs.changes.outputs.build == 'true'
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
      - run: ./gradlew.bat -p integration-test :mpp-producer:mingwX64Test

  # 現行バージョン表記と単一情報源の一致検証（ルートの checkVersionMentions。乖離時は
  # ./gradlew syncVersionMentions の結果をコミットして追随する）。ビルド入力を変更する PR
  # （Dependabot の版更新を含む）は build ジョブの check が同じ検証を含むため、このジョブは
  # ビルド入力の allowlist から除外されている .md など、表記側だけを変更する PR を拾う
  version-mentions:
    needs: changes
    if: needs.changes.outputs.versionMentions == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - run: ./gradlew :checkVersionMentions

  # 配布物のソースを変更する PR に CHANGELOG のエントリを要求する。
  # 記載漏れはリリースの準備まで気付けず、その時点では変更の意図が失われているため、PR の時点で検出する。
  # 照合は「## [Unreleased] 配下に当該 PR 番号の行があるか」だけを見る。書き方の規約は CLAUDE.md
  # 「CHANGELOG のルール」が正であり、ここは強制だけを持つ（CHANGELOG 本文へ運用は書かない）。
  # PR 番号は PR が立つまで確定しないため、ルートの check ではなく CI 側の検査とする。
  #
  # 記載が要らないのはコメント・整形のみの PR に限られる（内部変更には Internal 節という置き場がある）。
  # その判定は自動化せず、コミットの「Changelog: none」トレーラで書き手が明示する。自動判定を採らない理由:
  #   - 差分の行頭による判定は、スプレッド演算子や折り返しの継続行など * で始まるコード行を
  #     コメントと誤認しうる（＝記載漏れを見逃す側に倒れる）
  #   - 生成物のバイト比較でも解けない。コメント行の増減は LineNumberTable を動かすためクラスファイルが
  #     変わり、まさに除外したいケースで差分が出る（実測）。デバッグ属性を落とす正規化と base 側の
  #     ビルドが要り、費用に見合わない
  # トレーラはコミットに含まれるため push で自然に再評価される（ラベルは PR イベントを再発火させない）
  changelog:
    needs: changes
    if: needs.changes.outputs.changelog == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # PR のコミットメッセージを辿るため、base から到達できる深さで取得する
        with:
          fetch-depth: 0
      - env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if git log --format=%B "$BASE_SHA..HEAD" | grep -qiE '^Changelog:[[:space:]]*none[[:space:]]*$'; then
            echo "Changelog: none のトレーラがあるため CHANGELOG のエントリは要求しない"
            exit 0
          fi
          unreleased=$(awk '/^## \[Unreleased\]/ { inside = 1; next } /^## \[/ { inside = 0 } inside' CHANGELOG.md)
          if ! printf '%s\n' "$unreleased" | grep -q "^- #${PR_NUMBER}: "; then
            echo "::error file=CHANGELOG.md::CHANGELOG.md の '## [Unreleased]' に '- #${PR_NUMBER}: <変更>' の行がありません。書き方は CLAUDE.md の「CHANGELOG のルール」を参照してください。コメント・整形のみの PR はコミットへ 'Changelog: none' のトレーラを入れてください"
            exit 1
          fi

  # 必須チェックはこの 1 本へ集約する。
  # matrix を含む個別のジョブ名を必須チェックとして列挙すると、shard 数の変更で保護設定側が
  # 存在しない名前を要求し、マージ不能または無防備のどちらかへ静かに倒れるため。
  # ビルド入力に変更が無い PR では needs のジョブがスキップされるが、それは成功として扱う
  ci-gate:
    if: always()
    needs:
      - changes
      - build
      - integration-modules
      - integration-testkit
      - integration-maven
      - build-macos
      - native-windows
      - version-mentions
      - changelog
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          FAILED: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: |
          if [ "$FAILED" = "true" ]; then
            echo "::error::one or more jobs failed or were cancelled"
            exit 1
          fi

  # 依存グラフの登録。解決済みの推移依存まで Dependabot alerts の対象にするために行う
  # （マニフェスト由来の version updates は dependabot.yml が担う）。
  # リポジトリ設定の Automatic dependency submission は起動条件を持たず、ビルド入力と無関係な push でも
  # 常に走るため使わない。本ワークフローへ相乗りさせ、paths の allowlist と main への push に絞る。
  # 対象はルートビルドのみ（integration-test の依存は配布物に含まれない）
  dependency-submission:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # ジョブ単位の permissions はワークフロー既定を置き換える。snapshot の登録に contents: write が要る
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: 17
      # setup-gradle 相当と Gradle User Home のキャッシュを内包するアクションのため、両者を別途は置かない
      # （依存解決のみでコンパイルしないため ~/.konan のキャッシュも不要。他ジョブと同じキーで
      # 部分的な内容を保存してしまう事故も避ける）
      - uses: gradle/actions/dependency-submission@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        # 登録対象は配布物へ載る依存に絞る（alerts を利用者へ届くものに限るため）。対象とする
        # runtime classpath は公開 POM の compile / runtime スコープの元であり、compileOnly（maven-core /
        # kotlin-compiler-embeddable 等）・テスト・buildscript のクラスパスはここへ入らない。
        # フィルタは configuration 名の完全一致で、include と exclude は両方が適用される。
        # native ターゲットは runtime classpath を持たないが、runtime-api の依存は stdlib のみで
        # jvm / js 側の登録に含まれる（native 限定の依存を足す場合はこの指定を見直すこと）
        with:
          dependency-graph-include-configurations: ".*[Rr]untimeClasspath"
          dependency-graph-exclude-configurations: ".*[Tt]est[Rr]untimeClasspath"
