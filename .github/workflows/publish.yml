# CD。タグ v<KotlinVersion>-<自版> の GitHub Release の公開で駆動し、
# ルートビルドと integration-test の green を確認してから Maven Central と Gradle Plugin Portal へ公開する。
# タグ自体は release.yml が版宣言のマージ時に作る。GITHUB_TOKEN が作ったタグの push は
# ワークフローを起こさないため、起点は Release の作成という明示の操作に置く。
# ランナーは macos 単騎（宣言済みの全ターゲットをネイティブ + クロスコンパイルで賄えるため）。
# アクションはコミットハッシュで固定する（末尾コメントの vX.Y.Z は参照用。更新は Dependabot が追随する）
name: publish

on:
  release:
    types: [published]

permissions:
  contents: read

# 公開は取り消せないため、走行中のランをキャンセルしない
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: macos-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}

      # 版の正はビルド（カタログの Kotlin 版 + gradle.properties の enumizerVersion）であり、Release の
      # タグはその写しに過ぎない。両者の一致をここで確かめる。手で打たれたタグもこの照合で落ちる
      - name: Verify tag matches derived version
        run: |
          set -euo pipefail
          version=$(./gradlew -q properties --property version | sed -n 's/^version: //p')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match derived version $version"
            exit 1
          fi

      # ランナーが宣言ターゲットを全て賄えることを先に確かめる。賄えないターゲットの publication は
      # kotlin.native.ignoreDisabledTargets により静かに落ち、成果物が欠けたまま公開が成功してしまう。
      # 実行時の担保は publish タスクの依存としても掛かっており、ここは長いゲートの前で落とすための前倒し
      - name: Verify all declared targets are publishable
        run: ./gradlew :sealed-class-enumizer-runtime-api:checkPublishableTargets

      # 公開前のゲート。CI と同じ範囲を 1 ジョブで通す
      - run: ./gradlew build
      - run: >-
          ./gradlew -p integration-test build
          -x :gradle-integration:test -x :maven-integration:test
      # 重いテストはローカル Maven の非タイムスタンプ SNAPSHOT を入力に持ち UP-TO-DATE 判定が
      # 信用できないため --rerun で必ず再実行する（build.yml と同じ理由）
      - run: ./gradlew -p integration-test :gradle-integration:test --rerun
      - run: ./gradlew -p integration-test :maven-integration:test --rerun

      # Central Portal へはデプロイの作成までとし、公開の確定は Portal 上の validation 確認後に手で行う
      # （publishAndReleaseToMavenCentral は使わない）。vanniktech の設定値は ORG_GRADLE_PROJECT_ 接頭辞の
      # 環境変数で渡す（Gradle プロパティ名は大小文字を区別するため、シークレット名とは別に対応付ける）
      - name: Publish to Maven Central
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_IN_MEMORY_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_IN_MEMORY_KEY_PASSWORD }}
        run: ./gradlew publishToMavenCentral

      # Plugin Portal は取り消しができないため Central の後に置く
      - name: Publish to Gradle Plugin Portal
        env:
          GRADLE_PUBLISH_KEY: ${{ secrets.GRADLE_PUBLISH_KEY }}
          GRADLE_PUBLISH_SECRET: ${{ secrets.GRADLE_PUBLISH_SECRET }}
        run: ./gradlew :sealed-class-enumizer-gradle-plugin:publishPlugins

  # API ドキュメントの掲載。Pages のソースは Actions のため、公開されるのはこのジョブが上げる成果物であり、
  # 保管ブランチ（gh-pages）の内容が直接配信されることはない。同ブランチは過去版の出力だけを
  # versions/<版>/ の形で持ち、版切替 UI の入力として使う。deploy はサイト全体を置き換えるため、
  # 過去版の保持はこの保管場所から毎回作り直すことで成り立つ
  docs:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      # 初回リリース時は保管ブランチがまだ無い。その場合は空の履歴から始める
      - name: Restore archived versions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          url="https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          if git ls-remote --exit-code --heads "$url" gh-pages >/dev/null 2>&1; then
            git clone --branch gh-pages --depth 1 "$url" build/gh-pages
          else
            mkdir -p build/gh-pages
            git -C build/gh-pages init -b gh-pages -q
            git -C build/gh-pages remote add origin "$url"
          fi
          mkdir -p build/gh-pages/versions

      - run: ./gradlew dokkaGenerate -PolderDocsDir=build/gh-pages/versions

      # 保管するのは各版の出力そのものとし、生成物に含まれる過去版（older/）は落とす。
      # 落とさないと版を重ねるたびに過去版が入れ子で積み上がる
      - name: Archive this version
        run: |
          set -euo pipefail
          dest="build/gh-pages/versions/${GITHUB_REF_NAME#v}"
          rm -rf "$dest"
          mkdir -p "$dest"
          cp -r build/dokka/html/. "$dest/"
          rm -rf "$dest/older"

      # 保管ブランチの更新は通常のコミットで行う（force push は保護設定と整合しない）
      - name: Update archive branch
        working-directory: build/gh-pages
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "::notice::archive is already up to date"
          else
            git commit -q -m "docs: ${GITHUB_REF_NAME#v} の API ドキュメントを保管する"
            git push origin gh-pages
          fi

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: build/dokka/html
      - id: deploy
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0

  # 公開した版は消費済みのため、開発版（次パッチの -SNAPSHOT）へ戻す PR を出す。
  # 直接 push しないのは、既定ブランチが PR 経由の更新を必須としているため。
  # 配布物を説明する文書の版表記はここでは変わらない（同期の対象はリリース版を宣言している間に限るため、
  # 公開済みの版を指したまま据え置かれる）
  next-version:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      # GITHUB_TOKEN が作った PR には必須チェックが報告されないため、CI をブランチ指定で起こす
      actions: write
    steps:
      # タグではなく既定ブランチを起点にする（タグの指す位置が既定ブランチの先端とは限らない）
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - name: Open version bump pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          current=$(sed -n 's/^enumizerVersion=//p' gradle.properties)
          case "$current" in
            *-SNAPSHOT)
              echo "::notice::$current is already a development version"
              exit 0
              ;;
          esac
          IFS=. read -r major minor patch <<< "$current"
          next="$major.$minor.$((patch + 1))-SNAPSHOT"
          branch="chore/next-version-$next"
          sed -i "s/^enumizerVersion=.*/enumizerVersion=$next/" gradle.properties
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git commit -q -am "build: 開発版を $next へ進める"
          git push -q origin "$branch"
          gh pr create --base main --head "$branch" \
            --title "build: 開発版を $next へ進める" \
            --body "$(printf '%s\n' \
              "${GITHUB_REF_NAME#v} の公開に伴い、開発版を次のパッチへ進める。" \
              "" \
              "配布物を説明する文書の版表記は公開済みの版を指したまま据え置かれる。" \
              "次のリリースで -SNAPSHOT を外す際にまとめて追随する。")"
          # チェックはコミットの SHA へ紐付くため、この起動で PR 側の必須チェックが満たされる
          gh workflow run build.yml --ref "$branch"
