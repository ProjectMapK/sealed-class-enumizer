# CI（docs/チェックリスト.md §7）。基本は ubuntu（ルート build / integration-test のモジュールビルド /
# TestKit の分割実行 / Maven ビルド）で、OS 分岐は必要な範囲のみ: macos = Apple ターゲットのネイティブツールチェーン確認
# （ルート build のみ）・windows = mingwX64 の実行テストのみ（native の box 実行はホスト依存ゲートで
# Windows でしか走らない）。main への push では加えて依存グラフを登録する。
# アクションはコミットハッシュで固定する（末尾コメントの vX.Y.Z は参照用。更新は Dependabot が追随する）
name: build

# 起動条件は allowlist（paths）でビルドの入力だけに絞る（除外方式は、他のワークフローの追加・編集など
# 無関係ファイルの変更で起動してしまうため採らない）。ビルド入力となるファイル種別・パスを増やした場合は
# ここへ追加すること。本ファイル自身は列挙し、この CI 定義の変更では起動させる。
# .gitattributes は LF 正規化経由でフィクスチャの挙動に影響しうるため入力に含める
# （.editorconfig はビルドが読まないため列挙しない）。
# パターンは後勝ちのため、列挙パス内でもビルドに影響しない種別（.md）の個別除外は末尾の ! で行う。
# .txt は TestKit フィクスチャの入力種別のため、除外（!）の対象にしてはならない。
# CI を必須チェック化する場合はスキップとの整合を再設計すること
on:
  push:
    branches: [main]
    paths:
      - "**/src/**"
      - "**.gradle.kts"
      - "**.properties"
      - "gradlew"
      - "gradlew.bat"
      - "gradle/**"
      - "kotlin-js-store/**"
      - "integration-test/kotlin-js-store/**"
      - ".gitattributes"
      - ".github/workflows/build.yml"
      - "!**.md"
  pull_request:
    paths:
      - "**/src/**"
      - "**.gradle.kts"
      - "**.properties"
      - "gradlew"
      - "gradlew.bat"
      - "gradle/**"
      - "kotlin-js-store/**"
      - "integration-test/kotlin-js-store/**"
      - ".gitattributes"
      - ".github/workflows/build.yml"
      - "!**.md"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
      # K/N ツールチェーンと platform libs（Apple 系 klib のクロスコンパイルを含む）
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
      - run: ./gradlew build

  # integration-test は 9 モジュールのビルドと、重いテスト（TestKit / Maven）を別ジョブへ分ける。
  # 同一ジョブだと互いにランナーのコアを奪い合い、開始が待たされる
  integration-modules:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
      - run: >-
          ./gradlew -p integration-test build
          -x :gradle-integration:test -x :maven-integration:test

  # TestKit テストはランナーを増やして分割する。ランナーのコア数ではジョブ内の並行度を上げても
  # 実行時間が縮まらないため（同時実行 2 で 1 割・4 で頭打ち）、ジョブ内は直列にして分割数で稼ぐ。
  # 分割の振り分けはテストクラス名から決まるため、クラスを追加しても取りこぼさない
  integration-testkit:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
      # TestKit はローカル Maven の非タイムスタンプ SNAPSHOT を入力に持ち UP-TO-DATE 判定が信用できないため
      # --rerun で必ず再実行する（docs/test/フィクスチャ構成.md §4）
      - run: >-
          ./gradlew -p integration-test :gradle-integration:test --rerun
          -PtestShardIndex=${{ matrix.shard }} -PtestShardCount=3 -PtestKitParallelism=1

  # Maven ビルドの検証（docs/test/ケース06-ビルド動態.md §7）。Maven 本体は Gradle 側の依存として
  # 取得するためインストール手順は要らない。フィクスチャは Kotlin 一式をテスト専用のローカルリポジトリ
  # （~/.m2/repository とは別。docs/test/フィクスチャ構成.md §6）へ取得するため、そこをキャッシュする
  integration-maven:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: integration-test/maven-integration/build/maven-local-repo
          key: maven-repo-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
      # フィクスチャの入力にはローカル Maven の非タイムスタンプ SNAPSHOT が含まれ UP-TO-DATE 判定が
      # 信用できないため --rerun で必ず再実行する（TestKit と同じ理由）
      - run: ./gradlew -p integration-test :maven-integration:test --rerun

  build-macos:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
      - run: ./gradlew build

  native-windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
      - run: ./gradlew.bat -p integration-test :mpp-producer:mingwX64Test

  # 依存グラフの登録。解決済みの推移依存まで Dependabot alerts の対象にするために行う
  # （マニフェスト由来の version updates は dependabot.yml が担う）。
  # リポジトリ設定の Automatic dependency submission は起動条件を持たず、ビルド入力と無関係な push でも
  # 常に走るため使わない。本ワークフローへ相乗りさせ、paths の allowlist と main への push に絞る。
  # 対象はルートビルドのみ（integration-test の依存は配布物に含まれない）
  dependency-submission:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # ジョブ単位の permissions はワークフロー既定を置き換える。snapshot の登録に contents: write が要る
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 17
      # setup-gradle 相当と Gradle User Home のキャッシュを内包するアクションのため、両者を別途は置かない
      # （依存解決のみでコンパイルしないため ~/.konan のキャッシュも不要。他ジョブと同じキーで
      # 部分的な内容を保存してしまう事故も避ける）
      - uses: gradle/actions/dependency-submission@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
