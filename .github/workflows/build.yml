# CI（docs/チェックリスト.md §7）。基本は ubuntu の 2 ジョブ（ルート / integration-test）で、
# OS 分岐は必要な範囲のみ: macos = Apple ターゲットのネイティブツールチェーン確認（ルート build のみ）・
# windows = mingwX64 の実行テストのみ（native の box 実行はホスト依存ゲートで Windows でしか走らない）。
# アクションはコミットハッシュで固定する（末尾コメントの vX.Y.Z は参照用。更新は Dependabot が追随する）
name: build

# 起動条件は allowlist（paths）でビルドの入力だけに絞る（除外方式は、他のワークフローの追加・編集など
# 無関係ファイルの変更で起動してしまうため採らない）。ビルド入力となるファイル種別・パスを増やした場合は
# ここへ追加すること。本ファイル自身は列挙し、この CI 定義の変更では起動させる。
# .gitattributes は LF 正規化経由でフィクスチャの挙動に影響しうるため入力に含める
# （.editorconfig はビルドが読まないため列挙しない）。
# パターンは後勝ちのため、列挙パス内でもビルドに影響しない種別（.md）の個別除外は末尾の ! で行う。
# .txt は TestKit フィクスチャの入力種別のため、除外（!）の対象にしてはならない。
# CI を必須チェック化する場合はスキップとの整合を再設計すること
on:
  push:
    branches: [main]
    paths:
      - "**/src/**"
      - "**.gradle.kts"
      - "**.properties"
      - "gradlew"
      - "gradlew.bat"
      - "gradle/**"
      - "kotlin-js-store/**"
      - "integration-test/kotlin-js-store/**"
      - ".gitattributes"
      - ".github/workflows/build.yml"
      - "!**.md"
  pull_request:
    paths:
      - "**/src/**"
      - "**.gradle.kts"
      - "**.properties"
      - "gradlew"
      - "gradlew.bat"
      - "gradle/**"
      - "kotlin-js-store/**"
      - "integration-test/kotlin-js-store/**"
      - ".gitattributes"
      - ".github/workflows/build.yml"
      - "!**.md"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
      # K/N ツールチェーンと platform libs（Apple 系 klib のクロスコンパイルを含む）
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
      - run: ./gradlew build

  integration-test:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
      # TestKit はローカル Maven の非タイムスタンプ SNAPSHOT を入力に持ち UP-TO-DATE 判定が信用できないため
      # --rerun で必ず再実行する（docs/test/フィクスチャ構成.md §4）
      - run: ./gradlew -p integration-test build :gradle-integration:test --rerun

  build-macos:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
      - run: ./gradlew build

  native-windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
      - run: ./gradlew.bat -p integration-test :mpp-producer:mingwX64Test
