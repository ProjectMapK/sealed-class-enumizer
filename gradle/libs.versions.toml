[versions]
kotlin = "2.4.10"
# maven-plugin がコンパイル時に参照する Maven API の版（kotlin-maven-plugin 自身が依存する版に揃える）
maven = "3.9.12"
autoservice = "0.1.5"
ktfmt = "0.27.0"
mavenPublish = "0.37.0"
pluginPublish = "2.1.1"
dokka = "2.2.0"

[libraries]
kotlin-compiler-embeddable = { module = "org.jetbrains.kotlin:kotlin-compiler-embeddable", version.ref = "kotlin" }
kotlin-gradle-plugin-api = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin-api", version.ref = "kotlin" }
kotlin-maven-plugin = { module = "org.jetbrains.kotlin:kotlin-maven-plugin", version.ref = "kotlin" }
maven-core = { module = "org.apache.maven:maven-core", version.ref = "maven" }
kotlin-reflect = { module = "org.jetbrains.kotlin:kotlin-reflect", version.ref = "kotlin" }
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
autoservice = { id = "com.fueledbycaffeine.autoservice", version.ref = "autoservice" }
ktfmt = { id = "com.ncorti.ktfmt.gradle", version.ref = "ktfmt" }
vanniktech-maven-publish = { id = "com.vanniktech.maven.publish", version.ref = "mavenPublish" }
gradle-plugin-publish = { id = "com.gradle.plugin-publish", version.ref = "pluginPublish" }
dokka = { id = "org.jetbrains.dokka", version.ref = "dokka" }
